<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>
  <div class="left-content">
  
  <h1 class="left-title">Welcome to <span>Growth Steps</span></h1>
  <h1 class="left-textt">Agentic AI Workshop

  <p class="left-text">Build with Agentic AI. Learn, Create & Grow with Growth Steps. Register now and start building real-world AI agents.

<p class="visit-link">
    Visit Growth Steps:
    <a href="https://growth-steps-full-stack.vercel.app/" target="_blank">
        Visit Growth Steps 
    </a>
</p>
</div>
<div class="form-container">

  <div class="form-header">
    <h2>Let us reach you out</h2>
    <p class="subtitle">Give us a few details</p>
  </div>

  <form id="myForm">
    <div class="field-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your full name" required>
    </div>

    <div class="field-group">
      <label for="age">Age</label>
      <input type="number" id="age" min="1" max="120" placeholder="e.g. 24" required>
    </div>

    <div class="field-group">
      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="field-group">
      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" pattern="[0-9]{10}" placeholder="10 digit number" required>
    </div>

    <div class="field-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>

    <div class="field-group">
      <label for="profession">Profession</label>
      <input type="text" id="profession" placeholder="What do you do?" required>
    </div>

    <button type="submit" id="submitBtn">Submit</button>
    <p id="message"></p>
  </form>
</div>


<audio id="bgMusic" loop muted autoplay>
    <source src="./audio/peaceful.mp3" type="audio/mpeg">
</audio>

<button id="musicToggle" class="music-btn">
    Music: On
</button>

<script>
const music = document.getElementById("bgMusic");
const button = document.getElementById("musicToggle");
const VOLUME = 0.6;
let unmuted = false;

window.addEventListener("load", () => {
    music.volume = VOLUME;
    music.play().catch(err => console.log("Autoplay attempt:", err));
});

function unmuteOnInteraction() {
    if (unmuted) return;
    unmuted = true;
    music.muted = false;
    music.volume = VOLUME;
    music.play().catch(err => console.log("Unmute play failed:", err));
    button.textContent = "Music: On";
}

["click", "keydown", "touchstart", "scroll"].forEach(evt =>
    document.addEventListener(evt, unmuteOnInteraction, { once: true })
);

button.addEventListener("click", () => {
    if (music.muted || music.paused) {
        music.muted = false;
        music.volume = VOLUME;
        music.play();
        button.textContent = "Music: Off";
    } else {
        music.pause();
        button.textContent = "Music: On";
    }
});
</script>

<script src="script.js"></script>
</body>
</html>
